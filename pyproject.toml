[project]
name = "ct200-doc-intelligence"
version = "1.1.0"
description = "Structured, versioned document tree + LLM QA test-case generation for the CardioTrack CT-200 manual"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008: FastAPI's Depends()/Query() in argument defaults is the documented pattern
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
